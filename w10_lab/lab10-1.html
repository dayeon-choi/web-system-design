<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>글자 수 카운터 - 2510741 최다연</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 0.5rem;
            font-size: 1rem;
        }

        textarea:focus {
            outline: solid 2px #ccc;
        }

        .count {
            color: #666;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        #clearButton {
            padding: 10px 20px;
            background: red;
            color: white;
            border-radius: 8px;
            border: none;
        }

        #clearButton:active {
            background: darkred;
        }
    </style>
</head>

<body>
    <h1>나의 메모</h1>
    <textarea id="memoText" placeholder="여기에 글을 쓰세요..."></textarea>
    <div class="count">
        글자: <span id="charCount">0</span> · 단어: <span id="wordCount">0</span>
    </div>
    <button id="clearButton">지우기</button>

    <script lang="javascript">
        const textarea = document.querySelector('#memoText');
        const charEl = document.querySelector('#charCount');
        const wordEl = document.querySelector('#wordCount');
        const countEl = document.querySelector('.count');
        const clearButton = document.querySelector('#clearButton');

        // 글자 수에 따라 색상을 변경하는 함수
        const updateCharCountColor = charCount => {
            if (charCount >= 200) {
                countEl.style.color = 'red';
                countEl.style.fontWeight = 'bold';
                textarea.style.borderColor = 'red';
                textarea.style.borderColor = 'red';
                textarea.style.outlineColor = 'red';
            } else {
                countEl.style.color = '#666';
                countEl.style.fontWeight = 'normal';
                textarea.style.borderColor = '#ccc';
                textarea.style.outlineColor = '#ccc';
            }
        }

        // 글자 수와 단어 수를 계산해 화면에 표시하는 함수 (공통 코드 함수로 분리)
        const setMemoMetrics = memo => {
            const text = memo;
            charEl.textContent = text.length;
            wordEl.textContent = text.trim().split(/\s+/).filter(w => w).length; // 단어 수 계산 (연속된 공백 문자까지 1개의 공백으로 처리 및 분리 후 빈 문자열 제거)

            updateCharCountColor(text.length); // 글자 수에 따라 색상 업데이트
        }

        // 페이지 로드 시 localStorage에서 저장된 글 복원
        const savedMemo = localStorage.getItem('memo');
        if (savedMemo) {
            textarea.value = savedMemo;
            setMemoMetrics(savedMemo);
        }

        // textarea에 입력된 글자 수와 단어 수를 계산해 화면에 표시하는 이벤트 리스너 (입력 시마다 업데이트)
        textarea.addEventListener('input', () => {
            const text = textarea.value;
            localStorage.setItem('memo', text); // 입력된 글 localStorage에 저장
            setMemoMetrics(text);
        });

        // 지우기 버튼 클릭 시 textarea 내용과 카운터 초기화
        clearButton.addEventListener('click', () => {
            textarea.value = '';
            localStorage.removeItem('memo');
            setMemoMetrics('');
        });
    </script>
</body>

</html>
