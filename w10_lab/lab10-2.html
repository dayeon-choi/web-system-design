<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>북마크 매니저</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .form input {
            flex: 1;
            padding: 0.5rem;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
        }

        li.dragging {
            opacity: 0.4;
        }

        li.drag-over {
            background: #f0f8ff;
        }

        .name {
            flex: 1;
            cursor: pointer;
            color: #0066cc;
        }

        .name:hover {
            text-decoration: underline;
        }

        .star {
            cursor: pointer;
            user-select: none;
            color: #ccc;
            font-size: 1.2rem;
        }

        .star.active {
            color: gold;
        }

        .delete-btn {
            background: #ff5252;
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
        }

        .searchbar input {
            width: -webkit-fill-available;
            padding: 0.5rem;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .category {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <h1>나의 북마크</h1>
    <div class="form">
        <input type="text" id="nameInput" placeholder="사이트 이름">
        <input type="url" id="urlInput" placeholder="https://...">
        <input type="text" id="categoryInput" placeholder="카테고리 (선택)">
        <button id="addBtn">추가</button>
    </div>
    <div class="searchbar">
        <input type="text" id="searchInput" placeholder="🔍 검색 (이름 또는 URL)">
    </div>
    <div id="bookmarkList"></div>

    <script>
        const nameInput = document.querySelector('#nameInput');
        const urlInput = document.querySelector('#urlInput');
        const categoryInput = document.querySelector('#categoryInput');
        const addBtn = document.querySelector('#addBtn');
        const list = document.querySelector('#bookmarkList');
        const searchInput = document.querySelector('#searchInput');

        let dragSourceId = null;
        let dragSourceCategory = null;

        const clearDragOver = () => {
            list.querySelectorAll('.drag-over')
                .forEach((el) => el.classList.remove('drag-over'));
        };

        // 데이터 모델: [{ id, name, url, category, starred }, ...]
        let bookmarks = [];

        // 초기 데이터 로드: localStorage에서 bookmarks 불러오기 (JSON.parse)
        const savedBookmarks = localStorage.getItem('bookmarks');
        if (savedBookmarks) bookmarks = JSON.parse(savedBookmarks);

        // 북마크 항목들을 HTML로 렌더링하는 함수 (단일 리스트)
        const renderItems = (items) => {
            return items.map(({ id, name, url, starred }) => `
                <li draggable="true" data-id="${id}">
                    <span class="name">${name}</span>
                    <span class="star ${starred ? 'active' : ''}">★</span>
                    <button class="delete-btn">삭제</button>
                </li>
            `).join('');
        }

        // 북마크를 카테고리별로 그룹화해서 렌더링하는 함수
        const render = () => {
            const grouped = bookmarks.reduce((acc, bookmark) => {
                const category = bookmark.category || '미분류';
                if (!acc[category]) acc[category] = [];
                acc[category].push(bookmark);
                return acc;
            }, {});

            list.innerHTML = Object.entries(grouped).map(([category, items]) => `
                <div class="category">
                    <strong>📁 ${category}</strong><hr>
                    <ul data-category="${category}" class="category-list">${renderItems(items)}</ul>
                </div>
            `).join('');
        }

        // 북마크 정렬 함수: 즐겨찾기인 항목이 먼저 오도록, 동일한 그룹 내에서는 현재 순서를 유지
        const sortBookmarks = () => {
            bookmarks.sort((a, b) => b.starred - a.starred);
        }

        sortBookmarks();
        render();

        // 추가 버튼 클릭 이벤트
        addBtn.addEventListener('click', () => {
            // 입력값에서 앞뒤 공백 제거
            const name = nameInput.value.trim();
            const url = urlInput.value.trim();
            const category = categoryInput.value.trim();

            if (name && url) {
                // 새 북마크 객체 생성 후 bookmarks 배열에 추가
                bookmarks.push({ id: Date.now(), name, url, category, starred: false });
                localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
                render();

                // 입력 필드 초기화
                nameInput.value = '';
                urlInput.value = '';
                categoryInput.value = '';
            }
        });

        // 북마크 리스트 클릭 이벤트 (이벤트 위임)
        list.addEventListener('click', (e) => {
            const li = e.target.closest('li'); // 클릭된 요소에서 가장 가까운 li 요소 찾기
            if (!li) return; // li 요소가 아닌 곳 클릭 시 무시

            const id = Number(li.dataset.id); // li의 data-id 속성에서 id 가져오기
            const bookmark = bookmarks.find(bookmark => bookmark.id === id); // 해당 id의 북마크 객체 찾기

            // 별표 클릭: starred 토글
            if (e.target.classList.contains('star')) {
                bookmark.starred = !bookmark.starred; // 토글
                sortBookmarks(); // starred가 true인 항목이 먼저 오도록 정렬
            }
            // 삭제 버튼 클릭: bookmarks에서 제거
            else if (e.target.classList.contains('delete-btn')) {
                bookmarks = bookmarks.filter(bookmark => bookmark.id !== id);
            }
            // 사이트명 클릭: 새 탭에서 링크 열기
            else if (e.target.classList.contains('name')) {
                window.open(bookmark.url, '_blank');
            }

            localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            render();
        });

        // URL 벨리데이션 및 경고 (http:// 또는 https://로 시작하지 않는 경우)
        urlInput.addEventListener('input', () => {
            const url = urlInput.value.trim();
            const isValid = url && /^https?:\/\//i.test(url);

            urlInput.style.outlineColor = isValid ? '' : 'red'; // 유효하지 않으면 빨간색으로 강조
        });

        // URL 자동 보완 기능 (urlInput에서 포커스가 벗어날 때)
        urlInput.addEventListener('blur', () => {
            const url = urlInput.value.trim();
            if (url && !/^https?:\/\//i.test(url)) {
                urlInput.value = 'http://' + url; // http:// 자동 보완
                urlInput.style.outlineColor = ''; // 보완 후에는 기본 색상으로 설정
            }
        });

        // 검색 입력 이벤트: 입력된 검색어로 북마크 필터링 (이름 또는 URL에 검색어가 포함된 항목만 표시)
        searchInput.addEventListener('input', () => {
            const searchTerm = searchInput.value.trim().toLowerCase();

            // 검색어가 없으면 전체 북마크를 렌더링
            if (!searchTerm) {
                render();
            } else { // 있으면 필터링된 북마크를 렌더링
                const filteredBookmarks = bookmarks.filter(({ name, url }) =>
                    name.toLowerCase().includes(searchTerm) // 이름에 검색어 포함 여부
                    || url.toLowerCase().includes(searchTerm) // URL에 검색어 포함 여부
                );
                // 필터링된 북마크 표시
                list.innerHTML = renderItems(filteredBookmarks);
            }

        });

        // 드래그 앤 드롭 관련 함수: 같은 카테고리 내에서 항목 순서 변경
        const moveBookmarkToCategoryPosition = (sourceId, targetId) => {
            const sourceIndex = bookmarks.findIndex((bookmark) => bookmark.id === sourceId);
            const targetIndex = bookmarks.findIndex((bookmark) => bookmark.id === targetId);
            if (sourceIndex === -1 || targetIndex === -1) return; // 유효하지 않은 ID인 경우 함수 종료

            const [movedBookmark] = bookmarks.splice(sourceIndex, 1);
            const adjustedTargetIndex = bookmarks.findIndex((bookmark) => bookmark.id === targetId);
            bookmarks.splice(adjustedTargetIndex, 0, movedBookmark);
        }

        // 카테고리 끝으로 이동하는 함수: 드롭 위치가 항목이 아닌 카테고리 영역인 경우 해당 카테고리의 마지막으로 이동
        const moveBookmarkToCategoryEnd = (sourceId, category) => {
            const sourceIndex = bookmarks.findIndex((bookmark) => bookmark.id === sourceId);
            if (sourceIndex === -1) return;

            // 이동할 북마크를 배열에서 제거하고, 같은 카테고리 내에서 마지막 위치를 찾아 그 뒤에 삽입
            const [movedBookmark] = bookmarks.splice(sourceIndex, 1);
            const targetCategoryBookmark = [...bookmarks].reverse().find((bookmark) => (bookmark.category || '미분류') === category);

            if (targetCategoryBookmark) {
                const lastIndex = bookmarks.findIndex((bookmark) => bookmark.id === targetCategoryBookmark.id);
                bookmarks.splice(lastIndex + 1, 0, movedBookmark);
            } else {
                bookmarks.push(movedBookmark);
            }
        }

        // 드래그 앤 드롭 이벤트 리스너
        list.addEventListener('dragstart', (e) => {
            const li = e.target.closest('li');
            if (!li) return;
            const categoryList = li.closest('ul[data-category]');
            if (!categoryList) return;

            dragSourceId = Number(li.dataset.id);
            dragSourceCategory = categoryList.dataset.category;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(dragSourceId));
            li.classList.add('dragging');
        });

        // 드래그 종료 시 드래그 상태 초기화
        list.addEventListener('dragend', (e) => {
            const li = e.target.closest('li');
            if (li) li.classList.remove('dragging');

            clearDragOver();
            dragSourceId = null;
            dragSourceCategory = null;
        });

        // 드래그 오버 이벤트: 같은 카테고리 내에서만 드롭 허용, 드롭 가능한 항목에 시각적 표시
        list.addEventListener('dragover', (e) => {
            const categoryList = e.target.closest('ul[data-category]');
            if (!categoryList || dragSourceCategory !== categoryList.dataset.category) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            const li = e.target.closest('li');
            clearDragOver();
            if (li) li.classList.add('drag-over');
        });

        // 드래그가 리스트 영역을 벗어날 때 시각적 표시 제거
        list.addEventListener('dragleave', (e) => {
            const li = e.target.closest('li');
            if (li) li.classList.remove('drag-over');
        });

        // 드롭 이벤트: 같은 카테고리 내에서 항목 순서 변경 또는 카테고리 끝으로 이동, 변경된 북마크 배열을 localStorage에 저장 후 렌더링
        list.addEventListener('drop', (e) => {
            // 드롭 위치가 같은 카테고리인지 확인 (다른 카테고리로의 드롭은 허용 X)
            const categoryList = e.target.closest('ul[data-category]');
            if (!categoryList || dragSourceCategory !== categoryList.dataset.category) return;
            e.preventDefault(); // 드롭 기본 동작 방지

            // 드롭 위치가 항목인지 카테고리 영역인지에 따라 다른 이동 함수 호출
            const targetLi = e.target.closest('li');
            if (targetLi) {
                const targetId = Number(targetLi.dataset.id);
                // 드롭 위치가 항목인 경우: 같은 카테고리 내에서 순서 변경
                if (dragSourceId !== null && dragSourceId !== targetId) {
                    moveBookmarkToCategoryPosition(dragSourceId, targetId);
                }
            } else {
                moveBookmarkToCategoryEnd(dragSourceId, categoryList.dataset.category);
            }

            localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            sortBookmarks();
            render();
        });
    </script>
</body>

</html>
