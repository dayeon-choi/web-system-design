<!--
이름만 봐도 알 수 있는 태그를 말한다.
브라우저, 검색엔진, 개발자에게 콘텐츠의 구조와 의미를 명확히 설명하는 역할을 한다.

<header></header>: 머리말 (웹 페이지의 제목, 웹 페이지 설명 등 포함)에 해당하는 태그이다.
<nav></nav>: 링크가 걸려있는 네비게이션 영역을 의미한다.
<footer></footer> 꼬리말(저자, 저작권 정보 등 포함)에 해당하는 태그이다.
<main></main>: 메인 콘텐츠가 포함되는 영역을 의미하는 태그이다.
<article></article>: 독립된 문서 내용의 영역이다.
<aside></aside>: 본문의 내용과 구별되는 별개의 내용이 표현되는 영역의 태그이다.
<section></section>: 문서의 장이나 절에 해당하는 태그이다.
-->

<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      p:hover {
        color: yellow;
      }

      p {
        border: solid 1px black;

        height: 100px;
        width: 100px;
        text-align: center;
        line-height: 100px;
        border-radius: 100%;
      }

      .box1 {
        height: 100px;
        width: 100px;
        background-color: blue;
      }
    </style>
  </head>

  <body>
    <strong>두껍게 만들기</strong>
    <em>기울임체</em>

    <form>
      <fieldset>
        <legend><strong>필드셋 만들기</strong></legend>
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" /><br/>

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" /><br/>

        <label for="css">CSS</label>
        <input type="radio" id="css" name="language" value="CSS" />&nbsp;
        <label for="html">HTML</label>
        <input type="radio" id="html" name="language" value="HTML" />&nbsp;
        <label for="javascript">JavaScript</label>
        <input type="radio" id="javascript" name="language" value="JavaScript" /><br/>

        <input type="submit" id="submit" value="제출" />
        <input type="reset" id="reset" value="취소" />
      </fieldset>
    </form>

    <div style="display: flex; margin: 20px; height: 50px; text-align: center; align-items: center; justify-content: center;"><span>3번 문제<span></div>

    <p>호버해</p>

    <div class="box1"></div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
    <div class="lg:col-span-8 bg-white p-6 rounded-lg shadow ">메인 컨텐츠</div>
    <div class="lg:col-span-4 bg-white p-6 rounded-lg shadow">사이드바</div>
</div>

    <script>
      setTimeout(() => {
        document.querySelectorAll(".box1")
        .forEach((elem) => {
          elem.style.cssText = `
            transition: all 3s;
            transform: rotate(270deg);
            height: 300px;
            width: 300px;
            background-color: red;
          `;
        })
      }, 100)

    </script>
  </body>
</html>
